{% extends "base.html" %}
{% block navclass %}active{%endblock%}
{% block content %}
<div id="about">
  {% include 'author.html' %}
  <hr/>
</div>

<section id="content" class="content">
  <div id="article-list">
    {% block content_title %}
    {% endblock %}
    {% for article in articles_page.object_list %}
      <div class="row">
          <span class="text-muted">{{article.locale_date}}</span>
          <a href="{{ SITEURL }}/{{ article.url }}" rel="bookmark" 
            title="Permalink to {{ article.title|striptags }}">{{ article.title|striptags }}</a>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock content %}
